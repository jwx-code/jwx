#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - python3
  - python3-pip
  - mysql-server

runcmd:
  # add Docker GPG key (dearmor into keyring)
  - [ bash, -lc, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg" ]
  # add Docker apt repo
  - [ bash, -lc, 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list' ]
  # update apt and install docker packages
  - [ bash, -lc, "apt-get update" ]
  - [ bash, -lc, "DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]
  # enable services
  - [ bash, -lc, "systemctl enable --now docker" ]
  - [ bash, -lc, "systemctl enable --now mysql" ]
  # pip install MySQL connector (preferred for Python usage)
  - [ bash, -lc, "pip3 install --upgrade pip && pip3 install mysql-connector-python" ]
  # optional: write a log file so you can see cloud-init reached this step
  - [ bash, -lc, "echo 'cloud-init finished at $(date)' > /var/log/cloud-init-custom.log" ]
